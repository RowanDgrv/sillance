<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sillance · Admin</title>
<style>
  :root{
    --ink:#0B1120; --panel:#141B28; --panel-2:#1A2332; --line:rgba(150,165,200,.14);
    --line-strong:rgba(150,165,200,.28); --text:#E7EEF5; --muted:#8a949e;
    --accent:#46C2D8; --accent2:#FF9A3D; --good:#3ECF8E; --bad:#FF6B81;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font:14px/1.5 -apple-system,system-ui,sans-serif;
    background-image:linear-gradient(180deg,#0A0E17 0%,var(--ink) 38%);background-attachment:fixed;min-height:100vh}
  a{color:var(--accent)}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:20px;font-weight:800;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap}
  .hd .who{font-size:12.5px;color:var(--muted);text-align:right}
  button{font-family:inherit;cursor:pointer}
  .btn{background:var(--panel-2);border:1px solid var(--line-strong);color:var(--text);border-radius:8px;
    padding:7px 12px;font-size:12.5px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#06222a;border-color:var(--accent);font-weight:700}
  .btn.danger{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:var(--panel-2);
    border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* ---- Login ---- */
  #loginScreen{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:30px}
  #loginScreen h1{margin-bottom:4px}
  #loginScreen .fld{display:flex;flex-direction:column;gap:5px;margin-top:14px}
  #loginScreen .fld label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  #loginScreen input{width:100%}
  #loginScreen button{width:100%;margin-top:18px;padding:11px}
  #loginErr{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:14px}
  #cf-turnstile{margin-top:14px}

  /* ---- Toolbar ---- */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:220px}
  .stat-chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .stat-chip b{color:var(--text);font-family:ui-monospace,monospace}

  /* ---- Table ---- */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:10px 12px;border-bottom:1px solid var(--line-strong);background:var(--panel-2)}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(70,194,216,.04)}
  .name{font-weight:700}
  .email{color:var(--muted);font-size:12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
  .pill.role-coach{background:rgba(70,194,216,.14);color:var(--accent)}
  .pill.role-athlete{background:rgba(255,154,61,.14);color:var(--accent2)}
  .pill.role-club_admin{background:rgba(157,123,255,.14);color:#9d7bff}
  .pill.status-active,.pill.status-trialing{background:rgba(62,207,142,.14);color:var(--good)}
  .pill.status-canceled,.pill.status-past_due,.pill.status-unpaid{background:rgba(255,107,129,.14);color:var(--bad)}
  .pill.status-none{background:var(--panel-2);color:var(--muted)}
  .pill.banned{background:rgba(255,107,129,.18);color:var(--bad)}
  .mono{font-family:ui-monospace,monospace;font-size:12px}
  .athletes-list{font-size:12px;color:var(--muted);margin-top:3px}
  .athletes-list summary{cursor:pointer;color:var(--accent);font-size:12px}
  .notes-box{margin-top:6px}
  .note-row{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}
  .actions{display:flex;flex-direction:column;gap:5px;min-width:150px}
  .actions .row2{display:flex;gap:5px}
  .actions select,.actions input[type=number]{flex:1;padding:5px 7px;font-size:12px}
  .actions .btn{font-size:11.5px;padding:5px 8px}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--panel);border:1px solid var(--line-strong);
    border-radius:10px;padding:12px 16px;font-size:13px;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:none;z-index:50}
  .toast.err{border-color:var(--bad);color:var(--bad)}
  .toast.show{display:block}
  #linkBox{margin-top:6px;font-size:11px;word-break:break-all;color:var(--accent)}
  [hidden]{display:none!important}
  .empty{text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Sillance · Admin</h1>
  <div class="sub">Accès interne — maintenance des comptes.</div>
  <div class="fld"><label for="lgEmail">Email</label><input id="lgEmail" type="email" autocomplete="username"></div>
  <div class="fld"><label for="lgPass">Mot de passe</label><input id="lgPass" type="password" autocomplete="current-password"></div>
  <div id="cf-turnstile"></div>
  <button class="btn primary" id="lgBtn" disabled>Vérification en cours…</button>
  <div id="loginErr"></div>
</div>

<div class="wrap" id="mainScreen" hidden>
  <div class="hd">
    <div>
      <h1>Comptes Sillance</h1>
      <div class="sub">Vue de maintenance — lecture + actions ponctuelles.</div>
    </div>
    <div class="who">
      <div id="whoEmail"></div>
      <button class="btn" id="logoutBtn" style="margin-top:6px">Déconnexion</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="searchInp" placeholder="Filtrer par nom ou email…">
    <span class="stat-chip">Comptes <b id="statTotal">—</b></span>
    <span class="stat-chip">Coachs <b id="statCoach">—</b></span>
    <span class="stat-chip">Athlètes <b id="statAthlete">—</b></span>
    <span class="stat-chip">Abonnés actifs <b id="statActive">—</b></span>
    <button class="btn" id="refreshBtn">↻ Actualiser</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Compte</th><th>Rôle</th><th>Créé le</th><th>Forfait</th><th>Athlètes</th><th>Notes</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="emptyMsg" hidden>Aucun compte ne correspond au filtre.</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script type="module">
import { PF } from "./sillance-client.js";

const FN_URL = "https://onbsgohvqejccowfnrbs.supabase.co/functions/v1/admin-crm";
const TURNSTILE_SITE_KEY = "0x4AAAAAAEaRDnprER4n9rck";
let turnstileToken = "", turnstileWidgetId = null;
let USERS = [];

// Le bouton reste désactivé tant qu'aucun jeton n'est prêt : Turnstile
// (mode "managed") se résout tout seul en arrière-plan après le rendu, ça
// prend un instant — envoyer captchaToken vide fait échouer signInWithPassword
// côté Supabase Auth (constaté 21/09/2026 : "no captcha_token found").
function setLoginReady(ready, label) {
  const btn = document.getElementById("lgBtn");
  btn.disabled = !ready;
  btn.textContent = label || (ready ? "Se connecter" : "Vérification en cours…");
}
function renderTurnstile() {
  const el = document.getElementById("cf-turnstile");
  if (!el || typeof window.turnstile === "undefined") return false;
  try {
    turnstileWidgetId = window.turnstile.render(el, {
      sitekey: TURNSTILE_SITE_KEY,
      callback: (t) => { turnstileToken = t; setLoginReady(true); },
      "error-callback": () => { turnstileToken = ""; setLoginReady(false, "Vérification échouée — réessaie"); },
      "expired-callback": () => { turnstileToken = ""; setLoginReady(false, "Vérification expirée — réessaie"); },
    });
    return true;
  } catch (e) { console.warn("[admin] turnstile:", e); return false; }
}
// window.turnstile (chargé async/defer) n'est pas forcément prêt à window.load :
// on retente toutes les 200 ms plutôt que de parier sur un délai fixe.
(function waitForTurnstile(triesLeft) {
  if (renderTurnstile()) return;
  if (triesLeft <= 0) { setLoginReady(false, "Vérification indisponible — recharge la page"); return; }
  setTimeout(() => waitForTurnstile(triesLeft - 1), 200);
})(40); // ~8 s max

function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove("show"), 5000);
}

async function callAdmin(action, params) {
  const { data: sess } = await PF.sb.auth.getSession();
  const token = sess?.session?.access_token;
  if (!token) throw new Error("Session expirée, reconnecte-toi.");
  const res = await fetch(FN_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: JSON.stringify({ action, ...params }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Erreur ${res.status}`);
  return body;
}

function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function planLabel(sub) {
  if (!sub) return `<span class="pill status-none">Aucun</span>`;
  const tier = sub.tier ? ` · palier ${sub.tier}` : "";
  return `<span class="pill status-${sub.status}">${esc(sub.plan)}${tier} · ${esc(sub.status)}</span>`;
}

function rowHTML(u) {
  const athletesHtml = u.athleteCount
    ? `<details class="athletes-list"><summary>${u.athleteCount} athlète${u.athleteCount > 1 ? "s" : ""}</summary>
        ${u.athletes.map((a) => `<div>${esc(a.full_name || a.email || a.id)}</div>`).join("")}
       </details>`
    : `<span class="athletes-list">—</span>`;
  const notesHtml = `<div class="notes-box">
    ${u.notes.slice(0, 3).map((n) => `<div class="note-row">${esc(n.note)} <i>· ${fmtDate(n.created_at)}</i></div>`).join("")}
    ${u.notes.length > 3 ? `<div class="note-row">+ ${u.notes.length - 3} autre(s)</div>` : ""}
  </div>`;
  return `<tr data-id="${u.id}">
    <td>
      <div class="name">${esc(u.full_name || "—")} ${u.banned ? `<span class="pill banned">suspendu</span>` : ""}</div>
      <div class="email">${esc(u.email || "—")}</div>
    </td>
    <td><span class="pill role-${u.role}">${esc(u.role)}</span></td>
    <td class="mono">${fmtDate(u.created_at)}</td>
    <td>${planLabel(u.subscription)}<div class="mono" style="color:var(--muted);margin-top:3px">${u.subscription ? "depuis " + fmtDate(u.subscription.created_at) : ""}</div></td>
    <td>${athletesHtml}</td>
    <td>
      ${notesHtml}
      <div style="margin-top:5px"><input type="text" placeholder="+ note…" class="noteInp" style="width:100%;font-size:11.5px;padding:4px 6px"></div>
    </td>
    <td>
      <div class="actions">
        <div class="row2">
          <select class="planSel">
            <option value="">Plan…</option>
            <option value="coach" ${u.subscription?.plan === "coach" ? "selected" : ""}>coach</option>
            <option value="athlete" ${u.subscription?.plan === "athlete" ? "selected" : ""}>athlete</option>
            <option value="club" ${u.subscription?.plan === "club" ? "selected" : ""}>club</option>
          </select>
          <button class="btn setPlanBtn">OK</button>
        </div>
        <div class="row2">
          <input type="number" min="1" max="3" placeholder="Palier" class="tierInp" value="${u.subscription?.tier ?? ""}">
          <button class="btn setTierBtn">OK</button>
        </div>
        <button class="btn ${u.banned ? "" : "danger"} suspendBtn">${u.banned ? "Réactiver" : "Suspendre"}</button>
        <button class="btn resendBtn">Renvoyer email</button>
        <div id="link-${u.id}"></div>
      </div>
    </td>
  </tr>`;
}

function renderRows() {
  const q = document.getElementById("searchInp").value.trim().toLowerCase();
  const filtered = q
    ? USERS.filter((u) => (u.full_name || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q))
    : USERS;
  document.getElementById("rows").innerHTML = filtered.map(rowHTML).join("");
  document.getElementById("emptyMsg").hidden = filtered.length > 0;
  wireRowActions();
}

function wireRowActions() {
  document.querySelectorAll("#rows tr").forEach((tr) => {
    const id = tr.dataset.id;
    tr.querySelector(".setPlanBtn").onclick = async () => {
      const plan = tr.querySelector(".planSel").value;
      if (!plan) return toast("Choisis un plan d'abord.", true);
      try { const r = await callAdmin("setPlan", { userId: id, plan }); toast(r.warning || "Plan mis à jour."); await load(); }
      catch (e) { toast(e.message, true); }
    };
    tr.querySelector(".setTierBtn").onclick = async () => {
      const tier = +tr.querySelector(".tierInp").value || null;
      try { await callAdmin("setTier", { userId: id, tier }); toast("Palier mis à jour."); await load(); }
      catch (e) { toast(e.message, true); }
    };
    tr.querySelector(".suspendBtn").onclick = async () => {
      const willSuspend = tr.querySelector(".suspendBtn").textContent.trim() === "Suspendre";
      if (!confirm(willSuspend ? "Suspendre ce compte ?" : "Réactiver ce compte ?")) return;
      try { await callAdmin("suspend", { userId: id, suspend: willSuspend }); toast(willSuspend ? "Compte suspendu." : "Compte réactivé."); await load(); }
      catch (e) { toast(e.message, true); }
    };
    tr.querySelector(".resendBtn").onclick = async () => {
      try {
        const r = await callAdmin("resendEmail", { userId: id, type: "recovery" });
        const box = document.getElementById(`link-${id}`);
        box.innerHTML = `<div id="linkBox">Lien (au cas où l'email n'arrive pas) : <a href="${r.actionLink}" target="_blank" rel="noopener">ouvrir</a></div>`;
        toast("Lien généré — l'envoi automatique dépend du SMTP configuré côté Auth.");
      } catch (e) { toast(e.message, true); }
    };
    tr.querySelector(".noteInp").addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !e.target.value.trim()) return;
      try { await callAdmin("addNote", { userId: id, note: e.target.value.trim() }); e.target.value = ""; toast("Note ajoutée."); await load(); }
      catch (err) { toast(err.message, true); }
    });
  });
}

async function load() {
  try {
    const r = await callAdmin("list");
    USERS = r.users;
    document.getElementById("statTotal").textContent = USERS.length;
    document.getElementById("statCoach").textContent = USERS.filter((u) => u.role === "coach").length;
    document.getElementById("statAthlete").textContent = USERS.filter((u) => u.role === "athlete").length;
    document.getElementById("statActive").textContent = USERS.filter((u) => ["active", "trialing"].includes(u.subscription?.status)).length;
    renderRows();
  } catch (e) {
    toast(e.message, true);
  }
}

document.getElementById("searchInp").addEventListener("input", renderRows);
document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("logoutBtn").addEventListener("click", async () => { await PF.signOut(); location.reload(); });

document.getElementById("lgBtn").addEventListener("click", async () => {
  const email = document.getElementById("lgEmail").value.trim();
  const password = document.getElementById("lgPass").value;
  const errEl = document.getElementById("loginErr");
  errEl.textContent = "";
  if (!email || !password) { errEl.textContent = "Email et mot de passe requis."; return; }
  if (!turnstileToken) { errEl.textContent = "Vérification anti-robot pas encore prête, réessaie dans un instant."; return; }
  setLoginReady(false, "Connexion…");
  try {
    await PF.signIn({ email, password, captchaToken: turnstileToken });
    document.getElementById("whoEmail").textContent = PF.user.email;
    document.getElementById("loginScreen").hidden = true;
    document.getElementById("mainScreen").hidden = false;
    await load();
  } catch (e) {
    errEl.textContent = e.message || "Connexion échouée.";
    // Le jeton vient d'être consommé (accepté ou non par Auth) : on en
    // redemande un avant d'autoriser une nouvelle tentative.
    turnstileToken = "";
    setLoginReady(false, "Nouvelle vérification…");
    if (window.turnstile && turnstileWidgetId != null) window.turnstile.reset(turnstileWidgetId);
  }
});

(async function boot() {
  await PF.init();
  if (PF.user) {
    document.getElementById("whoEmail").textContent = PF.user.email;
    document.getElementById("loginScreen").hidden = true;
    document.getElementById("mainScreen").hidden = false;
    await load();
  }
})();
</script>
</body>
</html>
