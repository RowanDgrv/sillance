<style>
  :root{--paper:#0B1120;--panel:#121A2B;--ink:#F3F6FC;--soft:#C2CBDD;--muted:#8A93A8;--accent:#46C2D8;--orange:#FF9A3D;--line:rgba(150,165,200,.16);--line-strong:rgba(150,165,200,.30)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--soft);font-family:'Archivo',sans-serif;font-size:15px;line-height:1.65}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 22px 80px}
  header{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line-strong);margin-bottom:36px}
  .wm{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);text-decoration:none}
  .wm b{color:var(--accent)}
  nav a{color:var(--muted);text-decoration:none;font-size:13px;margin-left:18px}
  nav a:hover{color:var(--accent)}
  .lang-switch{display:inline-flex;gap:2px;margin-left:18px;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:2px}
  .lang-switch button{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;padding:5px 8px;
    border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer}
  .lang-switch button.active{background:var(--accent);color:#062028}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);margin-bottom:10px}
  .lead{font-size:16px;color:var(--soft);margin-bottom:36px}
  a{color:var(--accent)}
  .reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .review-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 24px;
    display:flex;flex-direction:column;gap:14px}
  .review-stars{color:var(--orange);font-size:14px;letter-spacing:2px}
  .review-quote{color:var(--soft);font-size:14px;line-height:1.65;font-weight:400;flex:1}
  .review-who{display:flex;align-items:center;gap:12px}
  .review-avatar{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#062028;
    display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;
    font-size:14px;flex:none}
  .review-name{color:var(--ink);font-weight:600;font-size:13.5px}
  .review-role{color:var(--muted);font-size:12px}
  .reviews-empty{color:var(--muted);font-size:14px;padding:30px 0}
  .cta{margin-top:46px;padding-top:28px;border-top:1px solid var(--line-strong)}
  .btn{display:inline-block;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;
    text-transform:uppercase;background:var(--accent);color:#062028;border:none;border-radius:8px;
    padding:13px 22px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line-strong);font-size:13px;color:var(--muted)}
  footer nav{margin-top:8px}
  footer nav a{margin-left:0;margin-right:16px}
  @media(max-width:880px){.reviews-grid{grid-template-columns:1fr}}
  @media(max-width:640px){
    .wrap{padding:32px 18px 60px}
    header{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:18px;margin-bottom:28px}
    nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
    nav a{margin-left:0}
    .lang-switch{margin-left:0}
    h1{font-size:28px}
  }
</style>
